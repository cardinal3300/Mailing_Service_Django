<!-- mailing/mailing_list.html -->
<h1>Управление рассылками</h1>
<a href="{% url 'mailing:mailing_create' %}">Создать рассылку</a>
<ul>
    {% for mailing in object_list %}
        <li>
            {{ mailing.name }} -
            <a href="{% url 'mailing:mailing_update' mailing.pk %}">Редактировать</a> |
            <a href="{% url 'mailing:mailing_delete' mailing.pk %}">Удалить</a> |
            <a href="{% url 'mailing:send_mailing' %}">Отправить</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'mailing:home' %}">На главную</a>
