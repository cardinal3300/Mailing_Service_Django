<!-- mailing/message_list.html -->
<h1>Управление сообщениями</h1>
<a href="{% url 'mailing:message_create' %}">Добавить сообщение</a>
<ul>
    {% for message in object_list %}
        <li>
            {{ message.subject }} -
            <a href="{% url 'mailing:message_update' message.pk %}">Редактировать</a> |
            <a href="{% url 'mailing:message_delete' message.pk %}">Удалить</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'mailing:home' %}">На главную</a>
