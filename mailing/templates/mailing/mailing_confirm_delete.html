{% extends "base.html" %}

{% block title %}удаление рассылки{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление рассылок</h1>
<p>Вы уверены, что хотите удалить рассылку "{{ recipient.email }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger">Да, удалить</button>
<a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-primary">Отмена</a>
</form>
{% endblock %}
