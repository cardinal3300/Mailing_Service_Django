{% extends "base.html" %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление получателя</h1>
<p>Вы уверены, что хотите удалить получателя "{{ recipient.email }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger">Да, удалить</button>
    <a href="{% url  'mailing:recipient_list' %}" class="btn btn-outline-primary">Отмена</a>
</form>
{% endblock %}
