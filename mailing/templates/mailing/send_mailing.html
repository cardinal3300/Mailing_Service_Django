<!-- mailing/send_mailing.html -->
<h1>Отправка сообщений по требованию</h1>
<form method="post">
    {% csrf_token %}
    <label for="mailing">Выберите рассылку:</label>
    <select name="mailing_id" id="mailing">
        {% for mailing in mailings %}
            <option value="{{ mailing.pk }}">{{ mailing }}</option>
        {% endfor %}
    </select>
    <button type="submit">Отправить</button>
</form>
<a href="{% url 'mailing:home' %}">На главную</a>
