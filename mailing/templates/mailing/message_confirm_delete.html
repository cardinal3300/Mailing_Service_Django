{% extends "base.html" %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление сообщения</h1>
<p>Вы уверены, что хотите удалить сообщение: "{{ message.subject }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger">Да, удалить</button>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-primary">Отмена</a>
</form>
{% endblock %}
