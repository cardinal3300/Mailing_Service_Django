<!-- mailing/message_confirm_delete.html -->
<h1>Удаление сообщения</h1>
<p>Вы уверены, что хотите удалить сообщение "{{ message.subject }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'mailing:message_list' %}">Отмена</a>
</form>
