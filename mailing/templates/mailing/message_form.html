{% extends "base.html" %}

{% block title %}Создание сообщения{% endblock %}

{% block content %}
<h1 class="mb-4">Создание сообщения</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
<a href="{% url 'mailing:message_list' %}" class="my-3 btn btn-primary">Назад к списку</a>
{% endblock %}
