{% extends "base.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<h1>Сброс пароля</h1>
<p>Введите ваш email, чтобы получить ссылку для сброса пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-2">Отправить</button>
</form>
<p><a href="{% url 'users:login' %}">Вернуться к входу</a></p>
{% endblock %}
