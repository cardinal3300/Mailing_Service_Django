{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Вход в систему</h2>
  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}

  </form>
</div>
{% endblock %}
